<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funções básicas</title>
    <style>
        /* Estilos simples para deixar a página mais organizada. */
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #243447;
        }

        main {
            max-width: 520px;
            margin: 40px auto;
            padding: 24px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 14px #00000018;
        }

        h1 { color: #1769aa; }

        input, button {
            box-sizing: border-box;
            margin: 8px 0;
            padding: 10px 12px;
            font: inherit;
        }

        input { width: 100%; }

        button {
            border: 0;
            border-radius: 6px;
            background-color: #1769aa;
            color: white;
            cursor: pointer;
        }

        button:hover { background-color: #10558b; }

        [aria-live] { min-height: 1.5em; }
    </style>
</head>
<body>
    <main>
        <h1>Olá!</h1>
        <p>Experimente algumas funções básicas de JavaScript.</p>

        <label for="nome">Seu nome:</label>
        <input id="nome" type="text" placeholder="Digite seu nome">
        <button type="button" onclick="cumprimentar()">Cumprimentar</button>
        <p id="mensagem" aria-live="polite"></p>

        <button type="button" onclick="mostrarData()">Mostrar data e hora</button>
        <p id="data-hora" aria-live="polite"></p>
    </main>

    <script>
        function cumprimentar() {
            // Pega o nome digitado e remove espaços extras.
            const nome = document.getElementById('nome').value.trim();
            document.getElementById('mensagem').textContent = nome
                ? `Olá, ${nome}!`
                : 'Olá! Digite seu nome primeiro.';
        }

        function mostrarData() {
            // Mostra a data e a hora no formato usado no Brasil.
            document.getElementById('data-hora').textContent =
                new Date().toLocaleString('pt-BR');
        }
    </script>
</body>
</html>
